# Ensure necessary services are enabled and started
---
- name: (HYPERVISOR) Enable libvirtd socket and service
  become: true
  ansible.builtin.service:
    name: "{{ systemd_unit }}"
    enabled: true
    state: started
  loop:
    - 'libvirtd.socket'
    - 'libvirtd.service'
  loop_control:
    loop_var: systemd_unit
  tags: ['hypervisor']

- name: (HYPERVISOR) Ensure that the target user is added to the libvirt group
  become: true
  ansible.builtin.user:
    name: "{{ user }}"
    groups: libvirt
    append: true
  tags: ['hypervisor']
