# Ensure necessary services are enabled and started
---
- name: Enable libvirtd socket
  become: yes
  ansible.builtin.service:
    name: libvirtd.socket
    enabled: true
    state: started
  tags: hypervisor

- name: Enable libvirtd service
  become: yes
  ansible.builtin.service:
    name: libvirtd.service
    enabled: true
    state: started
  tags: hypervisor
