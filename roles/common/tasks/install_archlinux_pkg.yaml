# Install custom list of packages on top of initial install
---
- name: Verify package lists
  ansible.builtin.assert:
    that:
      - arch_common_pkgs is defined
      - arch_graphical_pkgs is defined
    success_msg: "Arch package lists were defined"
    fail_msg: "Arch package lists were not defined"

- name: Sync pacman.conf
  become: true
  ansible.builtin.copy:
    src: files/arch/pacman.conf
    dest: /etc/pacman.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: pacman-conf --config=%s

- name: Install common packages
  become: true
  community.general.pacman:
    name: "{{ arch_common_pkgs }}"
    state: present
    update_cache: true

- name: Install graphical packages
  become: true
  community.general.pacman:
    name: "{{ arch_graphical_pkgs }}"
    state: present
    update_cache: false
  when:
    - graphics_enabled
