# Configure ClamAV to ensure new files are scanned
---
- name: Ensure that the clamd config is in place
  become: true
  ansible.builtin.copy:
    src: files/clamd.conf
    dest: /etc/clamav/clamd.conf
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: Ensure that the clamav database is being refreshed daily
  become: true
  ansible.builtin.service:
    name: clamav-freshclam.service
    enabled: true
    state: started

- name: Scan new files for malware signatures
  become: true
  ansible.builtin.service:
    name: "{{ clamav_onaccess }}"
    enabled: true
    state: started
  loop:
    - clamav-daemon.service
    - clamav-clamonacc.service
  loop_control:
    loop_var: clamav_onaccess
