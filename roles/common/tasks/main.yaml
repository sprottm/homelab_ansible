# Run validation tasks, then import common tasks by tag
---
- name: (ALWAYS) Ensure required variables were provided
  ansible.builtin.assert:
    that:
      - user is defined
      - appcache is defined
    success_msg: "Required variables were not defined."
    fail_msg: "Required variables were not defined."
  tags: ['always']

- name: (USER) Ensure username exists
  ansible.builtin.user:
    name: "{{ user }}"
    state: present
  register: user_info
  tags: ['common', 'user']

- name: (PKG) Install packages for the target OS
  ansible.builtin.include_tasks:
    file: "install_{{ ansible_facts['os_family'] | lower }}_pkg.yaml"
    apply:
      tags: ['common', 'pkg']
  tags: ['common', 'pkg']

- name: (FLATPAK) Install flatpak packages
  ansible.builtin.include_tasks:
    file: install_flatpaks.yaml
    apply:
      tags: ['common', 'flatpak']
  tags: ['common', 'flatpak']

- name: (USER) Configure user environment
  ansible.builtin.include_tasks:
    file: configure_user.yaml
    apply:
      tags: ['common', 'user']
  tags: ['common', 'user']

- name: (SSH) Configure SSH
  ansible.builtin.include_tasks:
    file: configure_ssh.yaml
    apply:
      tags: ['common', 'ssh']
  tags: ['common', 'ssh']

- name: (CLAMAV) Configure routine ClamAV scans
  ansible.builtin.include_tasks:
    file: configure_clamav.yaml
    apply:
      tags: ['common', 'clamav']
  tags: ['common', 'clamav']

- name: (FIREWALL) Ensure we have a firewall active
  ansible.builtin.include_tasks:
    file: configure_firewall.yaml
    apply:
      tags: ['common', 'firewall']
  tags: ['common', 'firewall']

- name: (HARDEN) Apply general security hardening on our system
  ansible.builtin.include_tasks:
    file: harden_system.yaml
    apply:
      tags: ['common', 'harden']
  tags: ['common', 'harden']

- name: (HARDEN) Ensure we have secure options on our mounts
  ansible.builtin.include_tasks:
    file: configure_secure_mounts.yaml
    apply:
      tags: ['common', 'harden']
  tags: ['common', 'harden']
