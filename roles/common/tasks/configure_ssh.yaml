# Set up SSH to only accept pubkey and operate over a non-standard port
---
- name: Replace SSH config with template
  become: true
  ansible.builtin.template:
    src: templates/sshd_config
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
    backup: true
    validate: sshd -t -f %s
  notify: Reload sshd
